
name: Sign IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -euo pipefail

          for name in P12_BASE64 P12_PASSWORD MOBILEPROVISION_BASE64 BUNDLE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

          if [ ! -f unsigned/app.ipa ]; then
            echo "::error::Upload your IPA as unsigned/app.ipa"
            exit 1
          fi

      - name: Prepare signing identity
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain-password"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F '"' '/Apple Development|Apple Distribution|iPhone Distribution/ {print $2; exit}')

          if [ -z "$IDENTITY" ]; then
            echo "::error::No usable Apple signing identity found."
            exit 1
          fi

          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign IPA
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -euo pipefail

          mkdir extracted
          unzip -q unsigned/app.ipa -d extracted

          APP_PATH=$(find extracted/Payload -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "::error::No iOS app found inside the IPA."
            exit 1
          fi

          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")

          if [ "$APP_ID" != "$BUNDLE_ID" ]; then
            echo "::error::The app bundle ID does not match BUNDLE_ID."
            exit 1
          fi

          PROFILE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")

          case "$PROFILE_ID" in
            *."$BUNDLE_ID") ;;
            *)
              echo "::error::The provisioning profile does not match the app bundle ID."
              exit 1
              ;;
          esac

          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP_PATH/embedded.mobileprovision"

          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" \
            "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

          find "$APP_PATH" -type d \( -name "*.framework" -o -name "*.appex" \) -print0 |
            while IFS= read -r -d '' ITEM; do
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$ITEM"
            done

          find "$APP_PATH" -type f -name "*.dylib" -print0 |
            while IFS= read -r -d '' ITEM; do
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$ITEM"
            done

          codesign --force --sign "$SIGNING_IDENTITY" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --timestamp=none "$APP_PATH"

          codesign --verify --deep --strict "$APP_PATH"

          mkdir -p signed
          cd extracted
          zip -qry ../signed/Signed.ipa Payload
          cd ..

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa
          path: signed/Signed.ipa
          if-no-files-found: error
          retention-days: 7
